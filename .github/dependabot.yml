version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/London'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '07:00'
      timezone: 'Europe/London'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-cdk:
        patterns:
          - 'aws-cdk*'
          - 'constructs'
      nextjs-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'eslint-config-next'
      typescript-types:
        patterns:
          - 'typescript'
          - '@types/*'
      eslint:
        patterns:
          - 'eslint*'
          - 'typescript-eslint*'
